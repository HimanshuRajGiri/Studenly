<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Studenly</title>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div>
            <h1>Studenly</h1>
            <nav>
                <ul>
                    <li><a href="#todo">To-Do</a></li>
                    <li><a href="#expense">Expense</a></li>
                    <li><a href="#notes">Notes</a></li>
                    <li><a href="#habit">Habit</a></li>
                </ul>
            </nav>
        </div>
    </header>    

    <!-- MAIN CONTENT -->
    <main class="container">

        <!-- TASK 1: TO-DO -->
        <section class="card" id="todo">
            <h2>To-Do List</h2>
            <input type="text" placeholder="Enter your task">
            <button>Add Task</button>
        </section>

        <!-- TASK 2: EXPENSE -->
        <section class="card" id="expense">
            <h2>Expense Tracker</h2>
            <input type="text" placeholder="Expense name">
            <input type="number" placeholder="Amount">
            <button>Add Expense</button>
        </section>

        <!-- TASK 3: NOTES -->
        <section class="card" id="notes">
            <h2>Notes</h2>
            <textarea placeholder="Write your notes here"></textarea>
            <button>Save Note</button>
        </section>

        <!-- TASK 4: HABIT -->
        <section class="card" id="habit">
            <h2>Habit Tracker</h2>
            <label><input type="checkbox"> Exercise</label><br>
            <label><input type="checkbox"> Study</label><br>
            <label><input type="checkbox"> Reading</label>
        </section>

    </main>

    <script src="script.js"></script> 
</body>
</html>
